name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.0.app
    - name: Build
      run: swift build
    - name: Run Tests
      run: swift test
    - name: Test with Coverage
      run: swift test --enable-code-coverage

  lint:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: SwiftLint
      run: |
        brew install swiftlint
        swiftlint --strict
